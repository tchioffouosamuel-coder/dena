services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: changeme_root
      MYSQL_USER: dena_user
      MYSQL_PASSWORD: changeme
      MYSQL_DATABASE: dena_db
    volumes:
      - dena_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u dena_user -pchangeme"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://dena_user:changeme@db:3306/dena_db
      JWT_SECRET: change_this_to_a_long_random_string
      JWT_EXPIRES_IN: 8h
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      MEDIA_LOCAL_PATH: ./uploads
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    ports:
      - "4000:4000"
    volumes:
      - dena_uploads:/app/uploads

volumes:
  dena_db_data:
  dena_uploads:
