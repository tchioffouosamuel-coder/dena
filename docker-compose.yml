services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dena_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: dena_db
    volumes:
      - dena_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dena_user -d dena_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dena_user:changeme@db:5432/dena_db?schema=public
      JWT_SECRET: change_this_to_a_long_random_string
      JWT_EXPIRES_IN: 8h
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      MEDIA_LOCAL_PATH: ./uploads
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    ports:
      - "4000:4000"
    volumes:
      - dena_uploads:/app/uploads

volumes:
  dena_db_data:
  dena_uploads:
