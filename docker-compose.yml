version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dena_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: dena_db
    volumes:
      - dena_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://dena_user:changeme@db:5432/dena_db?schema=public
      JWT_SECRET: change_this_to_a_long_random_string
      JWT_EXPIRES_IN: 8h
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      MEDIA_LOCAL_PATH: ./uploads
    ports:
      - "4000:4000"
    volumes:
      - dena_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  dena_db_data:
  dena_uploads:
